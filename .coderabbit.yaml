language: "en-US"
reviews:
  path_filters:
    - "**/*"
    - "!**/*.pot"
    # Exclude every PO file except the English source catalog (en.po).
    - "!**/[!e]*.po"
    - "!**/e.po"
    - "!**/e[!n]*.po"
    - "!**/en?*.po"
  auto_review:
    ignore_usernames:
      - "revolutionary-translation-bot"
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "doc/review_rules.md"
        applyTo: "**/*"
